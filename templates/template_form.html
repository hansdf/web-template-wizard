<!DOCTYPE html>
<html>
<head>
    <title>{{ .Action }} Template</title>
    <link rel="stylesheet" href="/static/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8" />
    <style>
        .container{max-width:840px;margin:20px auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
        input, textarea { width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:4px; }
        textarea{ min-height:300px; font-family: 'Courier New', Courier, monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{ .Action }} Template</h2>
        <form method="POST">
            {{ if .Template.ID }}<input type="hidden" name="id" value="{{ .Template.ID }}" />{{ end }}
            <label>Name</label>
            <input type="text" name="name" value="{{ .Template.Name }}" required />
            <label>Content</label>
            <textarea name="content" required>{{ .Template.Content }}</textarea>
            <button type="submit">Save</button>
            <a href="/templates">Cancel</a>
        </form>
    </div>
</body>
</html>
